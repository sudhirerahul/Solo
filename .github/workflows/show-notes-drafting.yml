# Show Notes Drafting — Claude Code Routine
#
# Prerequisites that must exist before this workflow can actually run (NONE of these exist yet
# as of 2026-07-25 — this workflow file is currently inert):
#   1. A GitHub remote for this repo (it is currently local-only, one commit on `main`).
#   2. The `ANTHROPIC_API_KEY` repository secret (Settings -> Secrets and variables -> Actions).
#   3. The Claude GitHub App installed on this repo: https://github.com/apps/claude
#   4. Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull
#      requests" enabled (required for the `gh pr create` step below to succeed with the
#      default `GITHUB_TOKEN`).
#
# Editorial instructions live in routines/show-notes-drafting/PROMPT.md, not in this file — this
# workflow only wires up the trigger, the Claude Code Action invocation, and PR creation.

name: Show Notes Drafting

on:
  push:
    branches: [main]
    paths:
      - 'transcripts/**'
  workflow_dispatch: {}

concurrency:
  group: show-notes-drafting
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-show-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        # actions/checkout@v7 confirmed current latest major as of 2026-07-25 via
        # https://github.com/actions/checkout/releases (v7.0.1). Reconfirm if this workflow
        # goes untouched for a long stretch.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Draft show notes with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read routines/show-notes-drafting/PROMPT.md in this repository and follow the
            instructions in its Prompt section exactly. Also read CLAUDE.md and apply its
            guardrails (never fabricate; cite sources; voice).

            Apply those instructions to every file in transcripts/ that has no file with the
            same basename in show-notes/.

            Write each result to show-notes/<same-basename>.md.

            Write only inside show-notes/. Do not modify any other file or attempt any git
            operation — a later workflow step handles opening a pull request.
          # Bash is deliberately excluded: since Claude cannot invoke git without Bash, this
          # structurally guarantees it cannot push, commit, or merge anything itself. Do not add
          # Bash to this list without re-reviewing that guarantee.
          claude_args: '--allowedTools "Read,Write,Edit,Glob,Grep" --max-turns 20'

      - name: Open draft PR with any drafted show notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- show-notes/)" ]; then
            echo "No new show notes drafted — nothing to open a PR for."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="show-notes/${{ github.run_id }}"
          git checkout -b "$branch"
          git add show-notes/
          git commit -m "Draft show notes (automated, needs review)"
          git push origin "$branch"

          gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "Draft show notes — needs human review" \
            --body "$(cat <<'PR_BODY'
          Automated draft generated by the show-notes-drafting workflow (`.github/workflows/show-notes-drafting.yml`), following the editorial instructions in `routines/show-notes-drafting/PROMPT.md`.

          This PR was opened by a workflow run with no Bash access for Claude and no direct push to `main` — Claude only wrote files under `show-notes/`; this shell step handled the branch, commit, and PR creation.

          **Needs a human read-through before merging**, per the guardrails in the root `CLAUDE.md` (never fabricate; verify citations; check voice). Confirm timestamps and quotes against the source transcript before approving.
          PR_BODY
          )"
